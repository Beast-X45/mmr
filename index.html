<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKWorld Lounge Overlay Setup</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            background: #e94560;
            padding: 10px;
            border-radius: 8px;
            color: white;
            text-shadow: none;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d13d56;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 15px;
            min-height: 20px;
        }
        .success { color: #4caf50; }
        .error { color: #ff3333; }
        .loading { color: #ffeb3b; }

        /* 使い方セクションのデザイン */
        .how-to-use {
            margin-top: 30px;
            padding: 20px;
            background-color: #1a1a2e;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }
        .how-to-use h2 {
            font-size: 16px;
            color: #e94560;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 5px;
        }
        .how-to-use ol {
            margin-left: 0;
            padding-left: 20px;
        }
        .how-to-use li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Overlay Setup</h1>
        <p style="margin-bottom: 20px; font-size: 14px; color: #aaa;">
            ラウンジネームを入力してください。
        </p>
        
        <input type="text" id="playerName" placeholder="プレイヤー名 (例: AK2KI)">
        <button id="generateBtn" onclick="generateAndCopy()">URLを生成してコピー</button>
        
        <div id="message"></div>

        <div class="how-to-use">
            <h2>使い方</h2>
            <ol>
                <li>上の入力欄に、<strong>正確なラウンジネームの</strong>を入力します。</li>
                <li>「URLを生成してコピー」ボタンを押します。</li>
                <li>URLがコピーできたら、配信ソフトのブラウザソース欄に高さ○○○,幅○○○を指定して、お好みの位置に配置して完了です！</li>
            </ol>
            <p style="margin-top: 10px; font-size: 12px; color: #888;">
                ※プレイヤー名が存在しない場合や入力ミスがある場合は、エラーが表示されます。
            </p>
        </div>
        </div>

    <script>
        async function generateAndCopy() {
            const nameInput = document.getElementById('playerName').value.trim();
            const btn = document.getElementById('generateBtn');

            if (!nameInput) {
                showMessage('ラウンジネームを入力してください。', 'error');
                return;
            }

            btn.disabled = true;
            showMessage('プレイヤー情報を取得中...', 'loading');

            const API_URL = `/api/player/details?name=${encodeURIComponent(nameInput)}&game=mkworld24p`;

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    showMessage('Player not found', 'error');
                    btn.disabled = false;
                    return;
                }

                const overlayUrl = `${window.location.origin}/overlay.html?name=${encodeURIComponent(nameInput)}`;
                await navigator.clipboard.writeText(overlayUrl);
                
                showMessage('URLをコピーしました！', 'success');
            } catch (error) {
                showMessage('エラーが発生しました', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = type;
        }
    </script>

</body>
</html>
