<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MKWorld Lounge Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: transparent; /* OBS透過用 */
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 全体コンテナ (1200x300px) */
        #overlay {
            position: relative;
            width: 1200px;
            height: 300px;
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
        }

        /* ★変更点：ページ切替を1秒かけてふわっとフェードイン/アウト */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 1200px;
            height: 300px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }

        .layer-img {
            position: absolute;
            display: block;
        }

        .rank-icon {
            left: 30px;
            top: 25px;
            height: 240px;
            width: auto;
        }

        /* ★変更点：ランク変動時に上から降ってくる特殊アニメーション */
        @keyframes rankDropIn {
            0% {
                transform: translateY(-260px);
                opacity: 0;
            }
            70% {
                transform: translateY(15px);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .rank-animate {
            animation: rankDropIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="page1" class="page active">
            <img id="p1-rank" class="layer-img rank-icon" src="" alt="Rank">
            <img id="mmr-d5" class="layer-img" src="" alt="">
            <img id="mmr-d4" class="layer-img" src="" alt="">
            <img id="mmr-d3" class="layer-img" src="" alt="">
            <img id="mmr-d2" class="layer-img" src="" alt="">
            <img id="mmr-d1" class="layer-img" src="" alt="">
            <img class="layer-img" src="word_Last.png" style="left:930px; top:60px; height:70px;" alt="Last">
            <img id="p1-diff-sign" class="layer-img" style="left:915px; top:150px; height:50px;" src="" alt="">
            <img id="p1-diff-1" class="layer-img" style="left:960px; top:140px; height:80px;" src="" alt="">
            <img id="p1-diff-2" class="layer-img" style="left:1010px; top:140px; height:80px;" src="" alt="">
            <img id="p1-diff-3" class="layer-img" style="left:1060px; top:140px; height:80px;" src="" alt="">
        </div>

        <div id="page2" class="page">
            <img id="p2-rank" class="layer-img rank-icon" src="" alt="Rank">
            <img class="layer-img" src="word_Last.png" style="left:275px; top:45px; height:80px;" alt="Last">
            <img class="layer-img" src="word_mogi.png" style="left:475px; top:45px; height:96px;" alt="mogi">
            <img class="layer-img" src="word_Tier.png" style="left:735px; top:44px; height:90px;" alt="Tier">
            <img id="tier-char1" class="layer-img" style="left:950px; top:40px; height:95px;" src="" alt="">
            <img id="tier-char2" class="layer-img" style="left:1010px; top:40px; height:95px;" src="" alt="">
            <img id="score-d100" class="layer-img" style="left:290px; top:150px; height:100px;" src="" alt="">
            <img id="score-d10"  class="layer-img" style="left:350px; top:150px; height:100px;" src="" alt="">
            <img id="score-d1"   class="layer-img" style="left:420px; top:150px; height:100px;" src="" alt="">
            <img class="layer-img" src="word_pts.png" style="left:495px; top:175px; height:80px;" alt="pts">
            <img id="p2-diff-sign" class="layer-img" style="left:720px; top:175px; height:50px;" src="" alt="">
            <img id="p2-diff-1" class="layer-img" style="left:780px; top:160px; height:80px;" src="" alt="">
            <img id="p2-diff-2" class="layer-img" style="left:830px; top:160px; height:80px;" src="" alt="">
            <img id="p2-diff-3" class="layer-img" style="left:890px; top:160px; height:80px;" src="" alt="">
            <img class="layer-img" src="word_mmr.png" style="left:945px; top:175px; height:65px;" alt="mmr">
        </div>

        <div id="error-screen" style="display: none; position: absolute; top: 0; left: 0; width: 1200px; height: 300px; color: #ff3333; font-family: 'Arial Black', 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 130px; font-weight: bold; text-align: center; line-height: 300px; z-index: 20000; text-shadow: 6px 6px 0px #000;">ERROR</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const PLAYER_NAME = urlParams.get('name') || ''; 

        const API_URL = `/api/player/details?name=${encodeURIComponent(PLAYER_NAME)}&game=mkworld24p`;

        let displayedMmr = 0;
        let targetMmr = 0;
        let mmrAnimationInterval = null;
        let pageSwitchInterval = null;
        let currentRankFile = ''; // 現在表示しているランク画像のファイル名を記憶

        const mmrPositions = [
            { id: 'mmr-d5', x: 275, y: 50 },
            { id: 'mmr-d4', x: 385, y: 54 },
            { id: 'mmr-d3', x: 495, y: 54 },
            { id: 'mmr-d2', x: 605, y: 54 },
            { id: 'mmr-d1', x: 715, y: 54 }
        ];

        const rankMap = {
            'iron': 'Rank_1_Iron.png', 'bronze': 'Rank_2_Bronze.png', 'silver': 'Rank_3_Silver.png',
            'gold': 'Rank_4_Gold.png', 'platinum': 'Rank_5_Platinum.png', 'sapphire': 'Rank_6_Sapphire.png',
            'ruby': 'Rank_7_Ruby.png', 'diamond': 'Rank_8_Diamond.png', 'master': 'Rank_9_Master.png',
            'grandmaster': 'Rank_10_Grandmaster.png'
        };

        function toLowerCaseKeys(obj) {
            if (Array.isArray(obj)) return obj.map(toLowerCaseKeys);
            if (obj !== null && typeof obj === 'object') {
                return Object.keys(obj).reduce((acc, key) => {
                    acc[key.toLowerCase()] = toLowerCaseKeys(obj[key]);
                    return acc;
                }, {});
            }
            return obj;
        }

        if (PLAYER_NAME) {
            fetchData();
            setInterval(fetchData, 2 * 60 * 1000); 
        } else {
            showError();
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    showError();
                    return;
                }
                
                const rawData = await response.json();
                const data = toLowerCaseKeys(rawData);
                
                hideError();

                const newMmr = data.mmr !== undefined ? data.mmr : 0;
                const rankName = data.rank || '未取得';
                const latestMatch = (data.mmrchanges && data.mmrchanges.length > 0) ? data.mmrchanges[0] : null;

                if (displayedMmr === 0 && newMmr !== 0) {
                    displayedMmr = newMmr;
                    targetMmr = newMmr;
                    updateMmrDisplay(displayedMmr);
                    updateRankDisplay(rankName);
                    if (latestMatch) updateMatchDisplay(latestMatch);
                    startPageSwitchLoop();
                    return;
                }

                if (newMmr !== targetMmr) {
                    targetMmr = newMmr;
                    startMmrAnimation();
                    updateRankDisplay(rankName);
                    if (latestMatch) {
                        const reasonStr = latestMatch.reason ? String(latestMatch.reason).toLowerCase() : '';
                        if (reasonStr.includes('table')) {
                            updateMatchDisplay(latestMatch);
                        }
                    }
                    startPageSwitchLoop();
                }

            } catch (error) {
                showError();
            }
        }

        function showError() {
            document.getElementById('error-screen').style.display = 'block';
            document.getElementById('page1').classList.remove('active');
            document.getElementById('page2').classList.remove('active');
            if (pageSwitchInterval) {
                clearInterval(pageSwitchInterval);
                pageSwitchInterval = null;
            }
        }

        function hideError() {
            document.getElementById('error-screen').style.display = 'none';
            if (!document.getElementById('page1').classList.contains('active') && !document.getElementById('page2').classList.contains('active')) {
                document.getElementById('page1').classList.add('active');
            }
        }

        function updateMmrDisplay(val) {
            const str = String(val).padStart(5, '0');
            const digits = str.split('');
            let keepZero = false;
            
            for (let i = 0; i < 5; i++) {
                const digit = digits[i];
                const imgEl = document.getElementById(mmrPositions[i].id);
                const pos = mmrPositions[i];
                
                if (i === 4 || digit !== '0' || keepZero) {
                    keepZero = true;
                    imgEl.src = `mmr_${digit}.png`;
                    imgEl.style.display = 'block';
                    imgEl.style.height = '180px'; 
                    imgEl.style.left = `${pos.x}px`; 
                    imgEl.style.top = `${pos.y}px`;
                } else {
                    imgEl.style.display = 'none';
                }
            }
        }

        function updateRankDisplay(rankName) {
            const lowRankName = String(rankName).toLowerCase();
            let fileName = rankMap[lowRankName];
            if (!fileName) {
                for (const key in rankMap) {
                    if (lowRankName.includes(key)) { fileName = rankMap[key]; break; }
                }
            }
            if (!fileName) fileName = 'Rank_1_Iron.png';

            const r1 = document.getElementById('p1-rank');
            const r2 = document.getElementById('p2-rank');

            // ランクが変わった場合の特殊落下アニメーション演出（初回以降）
            if (currentRankFile && currentRankFile !== fileName) {
                r1.src = fileName;
                r2.src = fileName;

                // アニメーションクラスをリセットして再適用
                r1.classList.remove('rank-animate');
                r2.classList.remove('rank-animate');
                void r1.offsetWidth; // リフロー発生させてアニメーションをやり直す
                void r2.offsetWidth;
                r1.classList.add('rank-animate');
                r2.classList.add('rank-animate');
            } else {
                r1.src = fileName;
                r2.src = fileName;
            }

            currentRankFile = fileName;
        }

        function updateMatchDisplay(match) {
            const delta = match.mmrdelta !== undefined ? match.mmrdelta : 0;
            const score = match.score !== undefined ? match.score : 0;
            const tier = match.tier || '';

            const signSrc = delta >= 0 ? 'D_plus.png' : 'D_minus.png';
            document.getElementById('p1-diff-sign').src = signSrc;
            document.getElementById('p2-diff-sign').src = signSrc;

            const absDeltaStr = String(Math.abs(delta)).split('');
            setDiffDigits(['p1-diff-1', 'p1-diff-2', 'p1-diff-3'], absDeltaStr);
            setDiffDigits(['p2-diff-1', 'p2-diff-2', 'p2-diff-3'], absDeltaStr);

            const scoreStr = String(score).split('');
            setScoreDigits(['score-d100', 'score-d10', 'score-d1'], scoreStr);

            const tierChars = String(tier).toUpperCase().split('');
            const t1 = document.getElementById('tier-char1');
            const t2 = document.getElementById('tier-char2');

            if (tierChars[0]) {
                t1.src = `Tier_${tierChars[0]}.png`; t1.style.display = 'block';
                t1.style.height = (tierChars[0] === 'Q') ? '101px' : '95px';
            } else { t1.style.display = 'none'; }

            if (tierChars[1]) {
                t2.src = `Tier_${tierChars[1]}.png`; t2.style.display = 'block';
                t2.style.height = (tierChars[1] === 'Q') ? '101px' : '95px';
            } else { t2.style.display = 'none'; }
        }

        function setDiffDigits(elementIds, digitArray) {
            for (let i = 0; i < elementIds.length; i++) {
                const el = document.getElementById(elementIds[i]);
                if (digitArray[i] !== undefined) { el.src = `D_${digitArray[i]}.png`; el.style.display = 'block'; }
                else { el.style.display = 'none'; }
            }
        }

        function setScoreDigits(elementIds, digitArray) {
            for (let i = 0; i < elementIds.length; i++) {
                const el = document.getElementById(elementIds[i]);
                if (digitArray[i] !== undefined) { el.src = `mmr_${digitArray[i]}.png`; el.style.display = 'block'; }
                else { el.style.display = 'none'; }
            }
        }

        function startMmrAnimation() {
            if (mmrAnimationInterval) clearInterval(mmrAnimationInterval);
            mmrAnimationInterval = setInterval(() => {
                if (displayedMmr < targetMmr) { displayedMmr++; updateMmrDisplay(displayedMmr); }
                else if (displayedMmr > targetMmr) { displayedMmr--; updateMmrDisplay(displayedMmr); }
                else { clearInterval(mmrAnimationInterval); mmrAnimationInterval = null; }
            }, 25);
        }

        function startPageSwitchLoop() {
            if (pageSwitchInterval) clearInterval(pageSwitchInterval);
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            pageSwitchInterval = setInterval(() => {
                if (document.getElementById('error-screen').style.display === 'block') return;
                
                if (page1.classList.contains('active')) { page1.classList.remove('active'); page2.classList.add('active'); }
                else { page2.classList.remove('active'); page1.classList.add('active'); }
            }, 10 * 1000);
        }
    </script>
</body>
</html>
